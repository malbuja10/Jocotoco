# ---------------------------------------------------------------------------
# API de audio Jocotoco - nginx con mTLS contra step-ca
# Ubuntu 24.04 + nginx 1.24 + php8.3-fpm
#
# Instalacion:
#   sudo cp deploy/nginx/jocotoco-api.conf /etc/nginx/sites-available/jocotoco-api
#   sudo ln -s /etc/nginx/sites-available/jocotoco-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificados (los emite step-ca, ver deploy/scripts/):
#   /etc/jocotoco/tls/servidor.crt   hoja + intermedia del servidor
#   /etc/jocotoco/tls/servidor.key   llave privada del servidor
#   /etc/step/certs/root_ca.crt      raiz de step-ca (valida a los clientes)
#   /etc/jocotoco/tls/crl.pem        lista de revocacion (opcional)
# ---------------------------------------------------------------------------

upstream jocotoco_php {
    server unix:/run/php/php8.3-fpm-jocotoco.sock;
}

# Redireccion de texto claro: el API solo responde sobre TLS.
server {
    listen 80;
    listen [::]:80;
    server_name api.jocotoco.local;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.jocotoco.local;

    # --- TLS del servidor --------------------------------------------------
    ssl_certificate     /etc/jocotoco/tls/servidor.crt;
    ssl_certificate_key /etc/jocotoco/tls/servidor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL_JOCOTOCO:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- mTLS: certificados de cliente emitidos por step-ca ---------------
    # "optional" permite que /v1/salud responda sin certificado; el resto de
    # las rutas se bloquea mas abajo y la aplicacion vuelve a comprobarlo.
    ssl_client_certificate /etc/step/certs/root_ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 2;

    # Revocacion: descomente cuando publique la CRL de step-ca.
    # ssl_crl /etc/jocotoco/tls/crl.pem;

    # --- Limites -----------------------------------------------------------
    # Debe ir acorde con JOCOTOCO_MAX_UPLOAD_BYTES y con php-fpm.
    client_max_body_size 64m;
    client_body_buffer_size 512k;
    client_body_timeout 120s;
    send_timeout 120s;
    keepalive_timeout 75s;

    # Las grabaciones se escriben en un directorio propio del servicio.
    client_body_temp_path /var/lib/jocotoco/nginx-tmp 1 2;

    # --- Seguridad ---------------------------------------------------------
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/jocotoco-api.access.log;
    error_log  /var/log/nginx/jocotoco-api.error.log warn;

    root /srv/jocotoco/public;
    index index.php;

    # Sonda de salud: accesible sin certificado de cliente para el monitoreo.
    location = /v1/salud {
        limit_except GET { deny all; }
        try_files $uri /index.php$is_args$args;
    }

    location / {
        # Doble barrera: nginx rechaza antes de llegar a PHP.
        if ($ssl_client_verify != SUCCESS) {
            return 403 '{"title":"Acceso denegado","status":403,"detail":"Se requiere un certificado de cliente emitido por step-ca."}';
        }

        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass jocotoco_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # --- Datos del certificado de cliente que consume la aplicacion ---
        fastcgi_param SSL_CLIENT_VERIFY      $ssl_client_verify;
        fastcgi_param SSL_CLIENT_CERT        $ssl_client_escaped_cert;
        fastcgi_param SSL_CLIENT_S_DN        $ssl_client_s_dn;
        fastcgi_param SSL_CLIENT_I_DN        $ssl_client_i_dn;
        fastcgi_param SSL_CLIENT_SERIAL      $ssl_client_serial;
        fastcgi_param SSL_CLIENT_FINGERPRINT $ssl_client_fingerprint;
        fastcgi_param SSL_CLIENT_V_START     $ssl_client_v_start;
        fastcgi_param SSL_CLIENT_V_END       $ssl_client_v_end;
        fastcgi_param SSL_PROTOCOL           $ssl_protocol;
        fastcgi_param SSL_CIPHER             $ssl_cipher;

        # Subidas grandes: no se bufferiza la peticion en nginx.
        fastcgi_request_buffering off;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 32k;
    }

    # Nada mas del arbol de la aplicacion se sirve directamente.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
