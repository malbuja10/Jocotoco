; OPcache para el API (Ubuntu 24.04, /etc/php/8.3/fpm/conf.d/99-jocotoco.ini)
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=96
opcache.interned_strings_buffer=12
opcache.max_accelerated_files=4000
; El codigo del API no cambia en caliente: se recarga php-fpm al desplegar.
opcache.validate_timestamps=0
opcache.jit=tracing
opcache.jit_buffer_size=32M
