; ---------------------------------------------------------------------------
; Pool de php-fpm 8.3 dedicado al API de audio Jocotoco (Ubuntu 24.04)
;
;   sudo cp deploy/php/jocotoco-pool.conf /etc/php/8.3/fpm/pool.d/jocotoco.conf
;   sudo systemctl restart php8.3-fpm
; ---------------------------------------------------------------------------

[jocotoco]
user = jocotoco
group = jocotoco

listen = /run/php/php8.3-fpm-jocotoco.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Un proceso que recibe audio puede tardar; se le da margen y se registra
; el que se pase de dos minutos.
request_terminate_timeout = 150s
request_slowlog_timeout = 30s
slowlog = /var/log/php8.3-fpm-jocotoco-slow.log

catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-jocotoco-error.log

; --- Limites de subida: deben ser >= JOCOTOCO_MAX_UPLOAD_BYTES ------------
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 65M
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 120
php_admin_value[upload_tmp_dir] = /var/lib/jocotoco/tmp

; --- Endurecimiento -------------------------------------------------------
php_admin_value[open_basedir] = /srv/jocotoco:/var/lib/jocotoco:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
php_admin_value[session.save_path] = /var/lib/jocotoco/tmp

; --- Configuracion de la aplicacion ---------------------------------------
; Cualquier clave de config/config.php puede definirse aqui con el
; prefijo JOCOTOCO_ y en mayusculas.
env[JOCOTOCO_DATA_DIR] = /var/lib/jocotoco
env[JOCOTOCO_REQUIRE_MTLS] = true
env[JOCOTOCO_CA_ISSUER_COMMON_NAME] = "Jocotoco Intermediate CA"
env[JOCOTOCO_MAX_UPLOAD_BYTES] = 67108864
env[JOCOTOCO_ALLOWED_FORMATS] = "wav,flac,ogg,opus,mp3"
env[JOCOTOCO_LOG_PATH] = /var/log/jocotoco/api.log
; Lista blanca de dispositivos; vacio acepta cualquier certificado de la CA.
; env[JOCOTOCO_ALLOWED_DEVICES] = "rpi-yanacocha-01,rpi-mindo-02"
; Clientes autorizados a consultar todos los dispositivos.
; env[JOCOTOCO_READER_DEVICES] = "panel-interno"
