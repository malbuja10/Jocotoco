; ---------------------------------------------------------------------------
; Pool de php-fpm 8.3 del PANEL WEB de monitoreo (separado del API)
;
; Corre como jocotoco_panel: otro usuario del sistema y otro rol de
; PostgreSQL. Lee todo lo que guarda el API pero solo puede escribir sus dos
; tablas (device_profiles, event_reviews). Pertenece al grupo jocotoco para
; leer los audios (directorios 0750 y archivos 0640 del API).
;
;   Lo instala deploy/scripts/09-instalar-panel.sh
; ---------------------------------------------------------------------------

[jocotoco-panel]
user = jocotoco_panel
group = jocotoco_panel

listen = /run/php/php8.3-fpm-jocotoco-panel.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
pm.max_requests = 500

request_terminate_timeout = 300s
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.3-fpm-jocotoco-panel-error.log

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[upload_max_filesize] = 1M
php_admin_value[post_max_size] = 2M

; --- Endurecimiento -------------------------------------------------------
php_admin_value[open_basedir] = /srv/jocotoco:/var/lib/jocotoco/audio:/var/lib/jocotoco-panel:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
php_admin_value[session.save_path] = /var/lib/jocotoco-panel/sesiones
php_admin_value[session.gc_maxlifetime] = 28800
php_admin_flag[session.use_strict_mode] = on

; --- Configuracion (mismas claves que el API, prefijo JOCOTOCO_) -----------
env[JOCOTOCO_DATA_DIR] = /var/lib/jocotoco
env[JOCOTOCO_DB_DRIVER] = pgsql
env[JOCOTOCO_DB_DSN] = "pgsql:host=/var/run/postgresql;dbname=jocotoco"
env[JOCOTOCO_PANEL_TIMEZONE] = America/Guayaquil
; Umbrales del panel (ver config/config.php):
; env[JOCOTOCO_PANEL_ONLINE_SECONDS] = 1800
; env[JOCOTOCO_PANEL_IDLE_SECONDS] = 21600
; env[JOCOTOCO_PANEL_VOLTAGE_MIN] = 11.5
; env[JOCOTOCO_PANEL_VOLTAGE_MAX] = 14.8
; env[JOCOTOCO_PANEL_CURRENT_MAX] = 5.0
