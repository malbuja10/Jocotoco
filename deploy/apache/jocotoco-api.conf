# ---------------------------------------------------------------------------
# API de audio Jocotoco - Apache 2.4 con mTLS contra step-ca
# Ubuntu 24.04 + apache2 2.4.58 + php8.3-fpm (mod_proxy_fcgi, MPM event)
#
# Instalacion:
#   sudo a2enmod ssl proxy_fcgi headers alias reqtimeout rewrite
#   sudo cp deploy/apache/jocotoco-api.conf /etc/apache2/sites-available/
#   sudo a2ensite jocotoco-api && sudo a2dissite 000-default
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Certificados (los emite step-ca, ver deploy/scripts/):
#   /etc/jocotoco/tls/servidor.crt   hoja + intermedia del servidor
#   /etc/jocotoco/tls/servidor.key   llave privada del servidor
#   /etc/step/certs/root_ca.crt      raiz de step-ca (valida a los clientes)
#   /etc/jocotoco/tls/crl.pem        lista de revocacion (opcional)
# ---------------------------------------------------------------------------

# === INICIO REDIRECCION HTTP ===
# El instalador elimina este bloque si el API no usa el puerto 443, para no
# chocar con otro sitio que ya sirva el puerto 80 en este servidor.
<VirtualHost *:80>
    ServerName api.jocotoco.local

    # El API solo responde sobre TLS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=308,L]

    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/jocotoco-api.error.log
    CustomLog ${APACHE_LOG_DIR}/jocotoco-api.access.log combined
</VirtualHost>
# === FIN REDIRECCION HTTP ===

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName api.jocotoco.local
    DocumentRoot /srv/jocotoco/public

    # --- TLS del servidor --------------------------------------------------
    SSLEngine on
    SSLCertificateFile    /etc/jocotoco/tls/servidor.crt
    SSLCertificateKeyFile /etc/jocotoco/tls/servidor.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder off
    SSLSessionTickets off
    # La CA es interna y no publica OCSP.
    SSLUseStapling off

    # --- mTLS: certificados de cliente emitidos por step-ca ---------------
    # SSLVerifyClient va a nivel de VirtualHost a proposito. Apache no puede
    # pedir el certificado por directorio cuando la conexion es TLS 1.3
    # (no existe renegociacion y Apache 2.4 no implementa la autenticacion
    # post-handshake), asi que el certificado se solicita en el handshake
    # inicial con "optional" y la autorizacion se decide despues, en las
    # secciones <Location> de mas abajo.
    SSLCACertificateFile /etc/step/certs/root_ca.crt
    SSLVerifyClient optional
    SSLVerifyDepth 2

    # StdEnvVars publica SSL_CLIENT_VERIFY / SSL_CLIENT_S_DN y ExportCertData
    # agrega SSL_CLIENT_CERT (el PEM completo), que es lo que la aplicacion
    # lee para obtener la identidad del dispositivo.
    SSLOptions +StdEnvVars +ExportCertData

    # Revocacion: descomente cuando publique la CRL de step-ca.
    # SSLCARevocationFile /etc/jocotoco/tls/crl.pem
    # SSLCARevocationCheck chain

    # --- Limites -----------------------------------------------------------
    # Debe ir acorde con JOCOTOCO_MAX_UPLOAD_BYTES y con php-fpm.
    LimitRequestBody 67108864
    Timeout 120
    ProxyTimeout 120
    # Una Raspberry con enlace lento necesita margen para subir la grabacion,
    # pero sin quedarse colgada indefinidamente.
    <IfModule mod_reqtimeout.c>
        RequestReadTimeout header=20-40,MinRate=500 body=120,MinRate=1000
    </IfModule>

    # --- Enrutado al controlador frontal ----------------------------------
    # Todas las rutas del API van directamente a index.php. Se usa AliasMatch
    # en lugar de FallbackResource o mod_rewrite para que no haya redireccion
    # interna: la autorizacion se evalua una sola vez, sobre la URL que pidio
    # el cliente, y las secciones <Location> de abajo se aplican tal cual.
    Alias "/errores" "/srv/jocotoco/public/errores"
    AliasMatch "^/(?!errores/).*$" "/srv/jocotoco/public/index.php"

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm-jocotoco.sock|fcgi://localhost"
    </FilesMatch>

    <Directory "/srv/jocotoco/public">
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None
        DirectoryIndex index.php
        # La autorizacion real esta en las secciones <Location>, que se
        # evaluan despues y reemplazan lo declarado aqui (AuthMerging Off).
        Require all granted
    </Directory>

    # Doble barrera: Apache rechaza antes de llegar a PHP, y la aplicacion
    # vuelve a comprobar el certificado por su cuenta.
    <Location "/">
        Require expr "%{SSL:SSL_CLIENT_VERIFY} == 'SUCCESS'"
    </Location>

    # Sonda de salud: accesible sin certificado de cliente para el monitoreo.
    <Location "/v1/salud">
        Require all granted
    </Location>

    # Alta automatica de dispositivos: por necesidad va sin certificado de
    # cliente, porque el equipo que se inscribe todavia no tiene ninguno. La
    # aplicacion exige el secreto de fabrica, acota los nombres admitidos,
    # limita los tokens por dispositivo y registra cada intento. Viene
    # deshabilitada (responde 404) mientras no se configure el secreto.
    <Location "/v1/inscripcion">
        Require all granted
    </Location>

    # Documentos de error propios, para que un rechazo de Apache tenga el
    # mismo formato problem+json que los errores de la aplicacion. La
    # seccion <Location> es imprescindible: sin ella la peticion interna al
    # documento de error tambien exigiria certificado y Apache responderia
    # su pagina HTML por defecto.
    <Location "/errores">
        Require all granted
    </Location>

    <Directory "/srv/jocotoco/public/errores">
        Require all granted
        ForceType application/problem+json
    </Directory>
    ErrorDocument 403 /errores/403.json
    ErrorDocument 413 /errores/413.json

    # --- Seguridad ---------------------------------------------------------
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=63072000"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "no-referrer"
    </IfModule>

    # --- Registro ----------------------------------------------------------
    # Se incluye el DN del cliente y el identificador de peticion que
    # devuelve la aplicacion, para poder auditar por dispositivo.
    LogFormat "%h %{SSL_CLIENT_S_DN}x \"%r\" %>s %O %{ms}Tms req=%{X-Request-Id}o" jocotoco
    ErrorLog ${APACHE_LOG_DIR}/jocotoco-api.error.log
    CustomLog ${APACHE_LOG_DIR}/jocotoco-api.access.log jocotoco
    LogLevel warn ssl:warn
</VirtualHost>
</IfModule>
