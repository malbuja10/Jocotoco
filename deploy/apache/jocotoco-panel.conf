# ---------------------------------------------------------------------------
# Panel web de monitoreo Jocotoco - Apache 2.4 + php8.3-fpm
#
# Sitio propio, en su puerto (8445 por defecto), separado del API: el API
# pide certificado de cliente (mTLS) y el panel se usa desde un navegador
# con usuario y contrasena.
#
# Lo instala deploy/scripts/09-instalar-panel.sh, que reemplaza PUERTO,
# DOMINIO y las rutas del certificado.
# ---------------------------------------------------------------------------
Listen __PUERTO__

<IfModule mod_ssl.c>
<VirtualHost *:__PUERTO__>
    ServerName __DOMINIO__
    DocumentRoot /srv/jocotoco/panel/public

    SSLEngine on
    SSLCertificateFile    __CERT__
    SSLCertificateKeyFile __KEY__
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionTickets off

    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm-jocotoco-panel.sock|fcgi://localhost"
    </FilesMatch>

    <Directory "/srv/jocotoco/panel/public">
        Options -Indexes -FollowSymLinks
        AllowOverride None
        DirectoryIndex index.php

        # Acceso solo con usuario y contrasena (htpasswd con bcrypt).
        # Usuarios: sudo htpasswd -B /etc/jocotoco/panel.htpasswd <usuario>
        AuthType Basic
        AuthName "Monitoreo Jocotoco"
        AuthBasicProvider file
        AuthUserFile /etc/jocotoco/panel.htpasswd
        Require valid-user
        # Opcional: limitar ademas por red, por ejemplo la de la oficina.
        # <RequireAll>
        #     Require valid-user
        #     Require ip 192.168.1.0/24
        # </RequireAll>
    </Directory>

    # El audio se sirve por audio.php (fuera del DocumentRoot), nunca directo.
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=63072000"
        Header always set X-Frame-Options "DENY"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/jocotoco-panel.error.log
    CustomLog ${APACHE_LOG_DIR}/jocotoco-panel.access.log combined
    LogLevel warn
</VirtualHost>
</IfModule>
