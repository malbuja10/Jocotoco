# Endurecimiento global de Apache para el servidor del API.
#   sudo cp deploy/apache/jocotoco-endurecimiento.conf /etc/apache2/conf-available/
#   sudo a2enconf jocotoco-endurecimiento && sudo systemctl reload apache2

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

# El API no sirve archivos estaticos ni necesita listados.
<Directory />
    Options -Indexes -Includes -ExecCGI
    AllowOverride None
    Require all denied
</Directory>
